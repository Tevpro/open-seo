name: Tevpro OpenSEO upstream update

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: tevpro-openseo-upstream-update
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'Tevpro/open-seo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Propose latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/tevpro-upstream-update.sh
